name: gamification_sdk
description: "Fachada pública y flujo común (código, juego, resultado) de la plataforma de minijuegos."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  gamification_core:
    path: ../gamification_core
  game_roulette:
    path: ../game_roulette
  game_scratch:
    path: ../game_scratch
  game_memory:
    path: ../game_memory
  game_dice:
    path: ../game_dice
  game_bomb:
    path: ../game_bomb
  game_bingo:
    path: ../game_bingo
  game_poker:
    path: ../game_poker
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Para probar el flujo completo con el cliente HTTP real contra los ejemplos del contrato.
  gamification_http:
    path: ../gamification_http
  http: ^1.6.0

flutter:
  uses-material-design: true
