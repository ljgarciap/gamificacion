name: gamification_http
description: "Cliente HTTP del backend de premios: implementa GamificationRepository contra la API v1 (JWT del host, Idempotency-Key, errores tipados)."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  gamification_core:
    path: ../gamification_core
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Para comprobar que los ejemplos reales del contrato los entienden los juegos, no solo el modelo.
  game_roulette:
    path: ../game_roulette
  game_scratch:
    path: ../game_scratch
  game_memory:
    path: ../game_memory
  game_dice:
    path: ../game_dice
  game_bomb:
    path: ../game_bomb
  game_bingo:
    path: ../game_bingo
