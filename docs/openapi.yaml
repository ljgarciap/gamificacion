openapi: 3.1.0
info:
  title: Gamificación — API de redención de códigos
  version: 1.0.0
  description: |
    API que valida códigos promocionales y entrega el premio YA asignado (SPEC-002). El servidor decide el resultado; el cliente solo lo representa.

    Contrato verificado por pruebas: `backend/tests/Feature/Contract/OpenApiContractTest` (este archivo contra el código) y
    `ContractExamplesTest` (los ejemplos de `docs/contract/examples/` contra respuestas reales). El cliente Flutter lee esos mismos
    ejemplos en `packages/gamification_http/test/contract_test.dart`.

    Descripción detallada de reglas y errores: `docs/api-v1.md`.
servers:
  - url: http://localhost:8000
    description: Desarrollo local (Docker)
security:
  - bearerAuth: []
tags:
  - name: Redención
  - name: Saldo
  - name: Dev
    description: Solo desarrollo local. Las rutas NO EXISTEN fuera de APP_ENV=local/testing, aunque GAMIF_DEV_ENDPOINTS esté activado.

paths:
  /v1/codes/redeem:
    post:
      tags: [Redención]
      summary: Redime un código y devuelve su resultado
      description: |
        Atómico (un código solo se redime una vez) e idempotente: el mismo usuario con la misma `Idempotency-Key` recibe EXACTAMENTE la misma
        respuesta, sin jugar ni acreditar de nuevo. La misma clave con otro código es un error de uso. Un intento fallido no consume la clave.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8 a 128 caracteres entre letras, números y `._-:`. Genérela una vez por intento y reutilícela al reintentar tras un fallo de red.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[A-Za-z0-9._\-:]{8,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 128
                  description: |
                    Se normaliza: mayúsculas/minúsculas, espacios, guiones, el prefijo (decorativo) y las confusiones O/0 e I/L/1 se toleran.
                  examples: ['RULETA-K3J9-QW2X-7HC']
      responses:
        '200':
          description: Resultado de la redención (o su repetición idéntica).
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Redemption' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CampaignInactive' }
        '409': { $ref: '#/components/responses/AlreadyUsed' }
        '410': { $ref: '#/components/responses/Expired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/spins:
    post:
      tags: [Redención]
      summary: Juega un giro hijo de una redención con giro extra
      description: |
        Una redención cuyo premio es «giro extra» concede `extraSpins` giros (campo `outcome.extraSpins`). Cada llamada juega UNO: el servidor
        consume la siguiente casilla de la reserva del lote y devuelve el resultado, con la misma forma que una redención más `parentRedemptionId`
        y `spinNo`. El servidor decide el resultado; el cliente solo lo anima. Un giro hijo puede conceder, a su vez, más giros.

        Idempotente: la misma `Idempotency-Key` con el mismo padre devuelve EXACTAMENTE la misma respuesta sin consumir otra casilla. La clave debe
        ser estable por giro (por ejemplo, el id del padre y el número de giro): una clave nueva es un giro nuevo. Los giros pendientes
        caducan cuando el lote se cierra o vence su ventana de redención.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[A-Za-z0-9._\-:]{8,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentRedemptionId]
              properties:
                parentRedemptionId: { type: string, format: uuid }
      responses:
        '200':
          description: Resultado del giro (o su repetición idéntica).
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Redemption' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: No hay un giro para jugar con esa redención (código `spinNotFound`). Idéntica para un padre ajeno, inexistente o mal formado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: '`noSpinsLeft` (la redención no tiene más giros por jugar) o `spinReserveExhausted` (la reserva del lote se agotó; nunca se inventa un premio).'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410': { $ref: '#/components/responses/Expired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/balance:
    get:
      tags: [Saldo]
      summary: Saldo del usuario en COP
      description: En el modo independiente es un saldo de demostración; en una app host la billetera es del host.
      responses:
        '200':
          description: Saldo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/HostUnavailable' }

  /v1/dev/token:
    post:
      tags: [Dev]
      summary: Emite un token de desarrollo (SOLO local)
      x-dev-only: true
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, minLength: 1, maxLength: 128, default: demo-user }
      responses:
        '200':
          description: Token firmado con el emisor de desarrollo.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresIn, userId]
                properties:
                  token: { type: string }
                  expiresIn: { type: integer, const: 300 }
                  userId: { type: string }
        '422': { description: userId inválido }
        '503': { description: El emisor de desarrollo no está configurado }

  /v1/dev/demo-codes:
    get:
      tags: [Dev]
      summary: Códigos de demostración que todavía se pueden canjear (SOLO local)
      x-dev-only: true
      security: []
      responses:
        '200':
          description: Lista de códigos.
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties:
                  codes:
                    type: array
                    items:
                      type: object
                      required: [code, game, description]
                      properties:
                        code: { type: string }
                        game: { type: string }
                        description: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT corto que emite la app host. `iss` registrado en la configuración del servidor (algoritmo y clave fijados por emisor: HS256, RS256 o
        ES256); `sub`, `aud` = `gamification`, `iat` y `exp` obligatorios; vida máxima 600 s. El usuario sale SOLO del token.

  responses:
    IdempotencyKeyRequired:
      description: Falta la `Idempotency-Key` o su formato es inválido.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: Token ausente o inválido. La respuesta es idéntica para toda causa (no se dice por qué).
      headers:
        WWW-Authenticate: { schema: { type: string, const: Bearer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    CampaignInactive:
      description: El lote está comprometido pero todavía no activo.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AlreadyUsed:
      description: El código ya fue canjeado (por otra persona, o por el mismo usuario si la campaña es `rejectOnly`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Expired:
      description: Lote cerrado o revelado, o ventana de redención vencida.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: '`invalidCode` (no existe, mal escrito, lote en borrador) o `idempotencyKeyReuse` (la clave ya se usó con otro código).'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Bloqueo por intentos fallidos o tope de peticiones. Cada reincidencia duplica el bloqueo hasta un tope.
      headers:
        Retry-After: { description: "Segundos a esperar", schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    HostUnavailable:
      description: La app host no respondió o su respuesta no es válida (código `hostUnavailable`). Nunca se devuelve un saldo inventado; reintentar tras `Retry-After`.
      headers:
        Retry-After: { description: "Segundos a esperar", schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServerError:
      description: Error interno. Nunca incluye detalles.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: "Orientativo; el cliente debe mapear `code`." }
            retryAfter: { type: integer, description: "Segundos (solo en `rateLimited`)." }

    ErrorCode:
      type: string
      enum:
        - invalidCode
        - alreadyUsed
        - expired
        - campaignInactive
        - rateLimited
        - idempotencyKeyReuse
        - idempotencyKeyRequired
        - unauthenticated
        - serverError
        - spinNotFound
        - noSpinsLeft
        - spinReserveExhausted

    Balance:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: "Pesos colombianos, sin decimales." }
        currency: { type: string, const: COP }

    PrizeType:
      type: string
      enum: [money, coupon, points, extraSpin, none]

    Prize:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/PrizeType' }
        label: { type: string }
        amount: { type: integer, description: 'COP para `money`; cantidad para `points`.' }
        couponCode: { type: string }
        iconKey: { type: string }

    Redemption:
      type: object
      required: [redemptionId, alreadyPlayed, playedAt, campaign, outcome]
      properties:
        redemptionId: { type: string, format: uuid }
        alreadyPlayed:
          type: boolean
          description: true si es el resultado anterior de un código ya jugado por este mismo usuario (`showPrevious`).
        playedAt: { type: string, format: date-time }
        campaign: { $ref: '#/components/schemas/Campaign' }
        outcome: { $ref: '#/components/schemas/Outcome' }
        parentRedemptionId:
          type: string
          format: uuid
          description: 'Solo en un giro hijo (`/v1/spins`): la redención que concedió el giro.'
        pendingSpins:
          type: array
          description: 'Solo en un resultado ya jugado (`alreadyPlayed`) y solo si quedan giros: los que esa redención (y los giros que salieron de ella) tienen por jugar. El siguiente giro de cada una se pide con la clave `<redemptionId>:<played + 1>`. Los giros caducan al cerrar el lote.'
          items:
            type: object
            required: [redemptionId, remaining, played]
            properties:
              redemptionId: { type: string, format: uuid }
              remaining: { type: integer, minimum: 1 }
              played: { type: integer, minimum: 0 }
        spinNo:
          type: integer
          minimum: 1
          description: 'Solo en un giro hijo: número de giro dentro de su padre.'

    Campaign:
      type: object
      required: [id, name, gameType, usedCodeBehavior, title, theme, gameConfig]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gameType: { type: string, enum: [roulette, scratch, memory, dice, bomb, bingo, poker] }
        usedCodeBehavior: { type: string, enum: [rejectOnly, showPrevious] }
        title: { type: [string, 'null'] }
        theme:
          type: object
          description: Tokens de color (`#RRGGBB`) y opcionalmente `fontFamily` y `logoUrl`. Vacío = tema por defecto.
          additionalProperties: { type: string }
        gameConfig:
          oneOf:
            - { $ref: '#/components/schemas/RouletteConfig' }
            - { $ref: '#/components/schemas/ScratchConfig' }
            - { $ref: '#/components/schemas/MemoryConfig' }
            - { $ref: '#/components/schemas/DiceConfig' }
            - { $ref: '#/components/schemas/BombConfig' }
            - { $ref: '#/components/schemas/BingoConfig' }
            - { $ref: '#/components/schemas/PokerConfig' }

    RouletteConfig:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          minItems: 4
          maxItems: 12
          items: { $ref: '#/components/schemas/Prize' }
        durationMs: { type: integer }
        fullTurns: { type: integer }
        offsetSpread: { type: number }

    ScratchConfig:
      type: object
      required: [rows, cols]
      properties:
        rows: { type: integer, minimum: 2, maximum: 5 }
        cols: { type: integer, minimum: 2, maximum: 5 }
        revealThreshold: { type: number }
        brushWidth: { type: number }

    MemoryConfig:
      type: object
      required: [pairs, columns, flipBackMs]
      properties:
        pairs: { type: integer, minimum: 3, maximum: 8, description: Parejas del tablero; las cartas son el doble. }
        columns: { type: integer, minimum: 2, maximum: 6 }
        flipBackMs: { type: integer, minimum: 300, maximum: 3000, description: Cuánto tiempo se ven dos cartas distintas antes de taparse. }
        rival: { type: boolean, description: "Solo si es true: el juego muestra una máquina que alterna turnos. Es un rival SIMULADO (animación); no influye en el premio, que ya está decidido." }

    BombConfig:
      type: object
      required: [cards, columns]
      properties:
        cards: { type: integer, minimum: 9, maximum: 16, description: Cartas de la cuadrícula; la mecha dura hasta voltearlas todas. }
        columns: { type: integer, minimum: 2, maximum: 5 }

    BingoConfig:
      type: object
      required: [draws, drawIntervalMs, legend]
      properties:
        draws: { type: integer, minimum: 24, maximum: 60, description: "Bolas que salen en una partida." }
        drawIntervalMs: { type: integer, minimum: 400, maximum: 3000, description: "Cada cuánto sale una bola en modo automático." }
        legend:
          type: array
          description: Patrones que pagan, del MAYOR al menor premio (la prioridad). Gana el de mayor prioridad que se complete en la partida.
          items:
            type: object
            required: [pattern, prize]
            properties:
              pattern: { type: string, enum: [line, corners, full] }
              prize: { $ref: '#/components/schemas/Prize' }

    PokerConfig:
      type: object
      required: [revealIntervalMs, legend]
      properties:
        revealIntervalMs: { type: integer, minimum: 400, maximum: 3000, description: "Cada cuánto abre el crupier la siguiente carta en modo automático." }
        legend:
          type: array
          description: Manos que pagan, de la mejor a la peor, con su premio.
          items:
            type: object
            required: [hand, prize]
            properties:
              hand: { type: string, enum: [three_of_a_kind, straight, flush, full_house, four_of_a_kind, straight_flush] }
              prize: { $ref: '#/components/schemas/Prize' }

    DiceConfig:
      type: object
      required: [diceCount, rollDurationMs, legend]
      properties:
        diceCount: { type: integer, const: 2 }
        rollDurationMs: { type: integer, minimum: 500, maximum: 5000 }
        legend:
          type: array
          description: Tabla de premios para mostrar en pantalla. Cada combinación pertenece a un solo premio.
          items:
            type: object
            required: [prize, rolls]
            properties:
              prize: { $ref: '#/components/schemas/Prize' }
              rolls:
                type: array
                items:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items: { type: integer, minimum: 1, maximum: 6 }
                description: Combinaciones `[a, b]` con `a ≤ b`; el orden en que caen los dados no importa.

    Outcome:
      type: object
      required: [prize, extraSpins, gameResult]
      properties:
        prize: { $ref: '#/components/schemas/Prize' }
        extraSpins: { type: integer, minimum: 0 }
        gameResult:
          oneOf:
            - { $ref: '#/components/schemas/RouletteResult' }
            - { $ref: '#/components/schemas/ScratchResult' }
            - { $ref: '#/components/schemas/MemoryResult' }
            - { $ref: '#/components/schemas/DiceResult' }
            - { $ref: '#/components/schemas/BombResult' }
            - { $ref: '#/components/schemas/BingoResult' }
            - { $ref: '#/components/schemas/PokerResult' }

    RouletteResult:
      type: object
      required: [segmentIndex]
      properties:
        segmentIndex: { type: integer, minimum: 0, description: "Segmento (de `gameConfig.segments`) donde se detiene la ruleta." }

    MemoryResult:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items: { type: string }
          description: |
            Símbolo de cada carta, fila por fila (`gameConfig.columns` por fila). Cada símbolo aparece exactamente dos veces.
            Premio = una pareja cuyo símbolo es el `prize.id`; sin premio no hay ninguna. Un símbolo desconocido se muestra como texto.

    BombResult:
      type: object
      required: [faces]
      properties:
        faces:
          type: array
          items: { type: string }
          description: |
            Cara de cada carta EN ORDEN DE VOLTEO: la n-ésima carta que el jugador voltea (sea cual sea su posición) muestra `faces[n]`.
            Premio = exactamente tres `"8"` (el tercero entre las últimas cartas); sin premio hay 0, 1 o 2. Gana quien destapa tres «8» antes
            de que la mecha (una carta por paso) se acabe. Un símbolo desconocido se muestra como texto.

    BingoResult:
      type: object
      required: [card, balls, events, winAt, pattern, cells, endAt]
      properties:
        card:
          type: array
          minItems: 5
          maxItems: 5
          description: Cartón de 5×5 por filas. Columnas B-I-N-G-O (1-15, 16-30, 31-45, 46-60, 61-75); el centro es `null` (casilla libre, siempre marcada).
          items: { type: array, minItems: 5, maxItems: 5, items: { type: [integer, 'null'] } }
        balls:
          type: array
          items: { type: integer, minimum: 1, maximum: 75 }
          description: Bolas EN ORDEN DE SALIDA (`gameConfig.draws`, sin repetir).
        events:
          type: array
          description: Cada vez que una bola completa por primera vez un patrón que paga (puede haber varios; los de menor premio avisan y la partida sigue).
          items:
            type: object
            required: [at, pattern, cells]
            properties:
              at: { type: integer, minimum: 1, description: "Número de bola (1 = la primera)." }
              pattern: { type: string, enum: [line, corners, full] }
              cells: { type: array, items: { type: array, minItems: 2, maxItems: 2, items: { type: integer, minimum: 0, maximum: 4 } }, description: "Casillas [fila, columna] que lo forman." }
        winAt: { type: [integer, 'null'], description: "Bola en que se completa el patrón del premio (null sin premio)." }
        pattern: { type: [string, 'null'], enum: [line, corners, full, null], description: "Patrón que paga (null sin premio)." }
        cells: { type: [array, 'null'], items: { type: array, items: { type: integer } }, description: "Casillas del patrón que paga, para resaltarlas." }
        endAt: { type: integer, minimum: 1, description: "Bola en que termina la partida: con el patrón de mayor prioridad es winAt; en los demás casos, la última bola." }

    PokerResult:
      type: object
      required: [hole, board, stages, category, hand, best]
      properties:
        hole:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string, pattern: '^[2-9TJQKA][SHDC]$' }
          description: "Las 2 cartas del jugador (rango 2-9 T J Q K A y palo S H D C)."
        board:
          type: array
          minItems: 5
          maxItems: 5
          items: { type: string, pattern: '^[2-9TJQKA][SHDC]$' }
          description: "Las 5 cartas comunes en el orden en que el crupier las abre (3, 1 y 1)."
        stages:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: string, enum: [high_card, pair, two_pair, three_of_a_kind, straight, flush, full_house, four_of_a_kind, straight_flush] }
          description: "Mejor mano tras el flop (5 cartas), el turn (6) y el river (7): lo que el jugador va viendo."
        category: { type: string, enum: [high_card, pair, two_pair, three_of_a_kind, straight, flush, full_house, four_of_a_kind, straight_flush], description: "La mejor mano de 5 entre las 7 cartas." }
        hand: { type: [string, 'null'], description: "La categoría si paga (premio de la redención); null si no paga." }
        best: { type: array, minItems: 5, maxItems: 5, items: { type: string }, description: "Las 5 cartas de la mejor mano, para resaltarlas." }

    DiceResult:
      type: object
      required: [dice]
      properties:
        dice:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: integer, minimum: 1, maximum: 6 }
          description: Cara de cada dado. La combinación (sin importar el orden) pertenece al premio de la redención según `gameConfig.legend`.

    ScratchResult:
      type: object
      required: [grid]
      properties:
        grid:
          type: array
          items: { type: string }
          description: |
            Símbolo de cada casilla, fila por fila. Premio = exactamente 3 símbolos iguales al `prize.id`; el relleno nunca forma otro trío.
            Un símbolo desconocido se muestra como texto.
