expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
; El tope es 1 000 000 de códigos por lote (Pool::MAX_TOTAL): la generación y la exportación necesitan holgura. Ver docs/hardening-p9.md.
memory_limit = 512M
max_execution_time = 60
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
session.cookie_httponly = 1
