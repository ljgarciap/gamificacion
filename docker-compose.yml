# Uso:
#   docker compose up --build web        -> build de producción en http://localhost:8080
#   docker compose up dev                -> hot reload en http://localhost:8081 (r = reload, R = restart)
#   docker compose run --rm tools test   -> analyze + tests de todo el workspace
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        # La web llama al backend DESDE EL NAVEGADOR. Por defecto, el de este mismo compose. Para usar el simulador: GAMIF_API_URL= docker compose build web
        GAMIF_API_URL: ${GAMIF_API_URL-http://localhost:8000}
    ports:
      - "8080:80"
    environment:
      ALLOWED_FRAME_ANCESTORS: "*"

  dev:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app/apps/standalone
    command: >
      sh -c "cd /app && flutter pub get &&
             cd apps/standalone &&
             flutter run -d web-server --web-hostname 0.0.0.0 --web-port 8081
             --dart-define=GAMIF_API_URL=${GAMIF_API_URL-http://localhost:8000}"
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - pub-cache:/root/.pub-cache
      - dart-tool:/app/.dart_tool
      - dart-tool-app:/app/apps/standalone/.dart_tool
    stdin_open: true
    tty: true

  tools:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app
    entrypoint: ["sh", "/app/docker/tools.sh"]
    volumes:
      - .:/app
      - pub-cache:/root/.pub-cache
      - dart-tool:/app/.dart_tool
      - dart-tool-app:/app/apps/standalone/.dart_tool

  # --- Backend de premios (SPEC-002) ---
  #   docker compose up -d db backend          -> API en http://localhost:8000 (GET /up = salud)
  #   docker compose run --rm backend php artisan migrate
  #   docker compose run --rm backend php artisan test
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamification
      POSTGRES_USER: gamification
      # Solo desarrollo local; el servicio no se publica fuera de la red de compose.
      POSTGRES_PASSWORD: gamification
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamification -d gamification"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    # Servidor integrado de PHP en vez de `artisan serve`: este último NO pasa al servidor las variables de entorno del contenedor (solo unas
    # pocas) y leería el .env (DB_CONNECTION=sqlite) en vez de PostgreSQL. Varios procesos: la web hace peticiones en paralelo (saldo, canje...).
    command: php -S 0.0.0.0:8000 -t public public/index.php
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: gamification
      DB_USERNAME: gamification
      DB_PASSWORD: gamification
      # Vectores de prueba del verificador independiente (SPEC-002 §4): el motor debe reproducirlos byte a byte.
      PHP_CLI_SERVER_WORKERS: "4"
      VERIFIER_DIR: /verifier
      CONTRACT_DIR: /docs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - ./verifier:/verifier:ro
      # Contrato (OpenAPI y ejemplos): las pruebas lo comparan con el código y, con UPDATE_CONTRACT_EXAMPLES=1, regeneran los ejemplos.
      - ./docs:/docs

  # --- Host simulador (SPEC-003 RF-53): SOLO desarrollo. Implementa docs/contrato-host.md con una billetera de juguete. ---
  #   docker compose up -d host-sim        -> http://localhost:8095  (estado: GET /__sim/state; fallos: POST /__sim/mode)
  #   En el backend (APP_ENV=local): GAMIF_FULFILLMENT=http GAMIF_BALANCE=http y registrar el host en el panel con
  #   callbackUrl http://host-sim:8095/callback y balanceUrl http://host-sim:8095/balance (http solo se admite en `local`).
  host-sim:
    image: php:8.3-cli-alpine
    command: php -S 0.0.0.0:8095 -t /sim /sim/index.php
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
      # El primero firma las respuestas; todos verifican (para ensayar una rotación pon dos separados por coma).
      HOST_SIM_SECRETS: ${HOST_SIM_SECRETS:-secreto-del-simulador-solo-desarrollo}
    ports:
      - "8095:8095"
    volumes:
      - ./host-sim:/sim:ro

volumes:
  db-data:
  backend-vendor:
  pub-cache:
  dart-tool:
  dart-tool-app:
